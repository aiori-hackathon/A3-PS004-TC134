//
// BIND 9 Authoritative Server for PS-004 Controlled DNSSEC Lab
// Runs on 127.0.0.1 port 5300
//

options {
    listen-on port 5300 { 127.0.0.1; };
    listen-on-v6 { none; };
    directory "/var/named";
    dump-file "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";
    secroots-file "/var/named/data/named.secroots";
    recursing-file "/var/named/data/named.recursing";

    // Strictly Authoritative Only (No recursion)
    recursion no;
    allow-query { any; };

    dnssec-validation no; // Authoritative server serves records, does not validate
};

logging {
    channel default_debug {
        file "data/named.run";
        severity dynamic;
    };
};

// 1. Primary signed zone containing SECURE and BOGUS records
zone "iotlab.internal" IN {
    type primary;
    file "db.iotlab.internal.signed";
    allow-transfer { none; };
};

// 2. Unsigned delegated child zone proving INSECURE status
zone "insecure.iotlab.internal" IN {
    type primary;
    file "db.insecure.iotlab.internal";
    allow-transfer { none; };
};
