# Unbound Validating Recursive Resolver Configuration for PS-004
# Runs on 127.0.0.1 port 1053 (avoids port 5353 mDNS/avahi collision)
# Validates DNSSEC against local lab trust anchor and queries BIND at 127.0.0.1@5300

server:
    verbosity: 2
    interface: 127.0.0.1
    port: 1053
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Allow local queries
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    access-control: 10.0.0.0/8 allow

    # CRITICAL: Allow Unbound to query authoritative servers on localhost port 5300
    do-not-query-localhost: no

    # DNSSEC Validation Settings (RFC 4033, 4035)
    val-log-level: 2
    val-clean-additional: yes

    # RFC 8914 Extended DNS Errors (sends EDE code 6 for DNSSEC Bogus)
    ede: yes
    ede-serve-expired: no

    # RFC 9520 Negative Caching: cache resolution & validation failures
    val-sig-skew-min: 0
    val-sig-skew-max: 0

    # Trust anchor file generated dynamically during lab setup
    include: "/etc/unbound/local-trust-anchor.conf"

# Stub zone forwarding queries for iotlab.internal to our local authoritative BIND server
stub-zone:
    name: "iotlab.internal"
    stub-addr: 127.0.0.1@5300
